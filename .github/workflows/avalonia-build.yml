name: Avalonia Build Gate

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: DatabaseManager.Avalonia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DatabaseManager.Avalonia.sln
      - name: Build
        run: dotnet build DatabaseManager.Avalonia.sln --no-restore --configuration Release -warnaserror:0
      - name: Regression checks
        run: |
          dotnet build DatabaseManager.AppCore.RegressionTests --configuration Release -p:UsedAvaloniaProducts=
          dotnet run --project DatabaseManager.AppCore.RegressionTests --no-build --configuration Release
      - name: Test
        run: dotnet test DatabaseManager.Avalonia.sln --no-restore --configuration Release --no-build
