name: Publish V1.1.1

on:
  push:
    branches: [master]
    paths: [.github/workflows/release-v1.1.1.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.1.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and verify
        run: |
          dotnet build DatabaseManager.Avalonia/DatabaseManager.Avalonia.sln -c Release -p:UsedAvaloniaProducts=
          dotnet build DatabaseManager.Avalonia/DatabaseManager.AppCore.RegressionTests -c Release -p:UsedAvaloniaProducts=
          dotnet run --project DatabaseManager.Avalonia/DatabaseManager.AppCore.RegressionTests -c Release --no-build
      - uses: actions/checkout@v4
        with:
          ref: v1.1.1
      - name: Publish and package
        run: |
          project=DatabaseManager.Avalonia/DatabaseManager.Avalonia/DatabaseManager.Avalonia.csproj
          dotnet publish "$project" -c Release -r win-x64 --self-contained true -p:UsedAvaloniaProducts= -o artifacts/win-x64
          dotnet publish "$project" -c Release -r linux-x64 --self-contained true -p:UsedAvaloniaProducts= -o artifacts/linux-x64
          test -f artifacts/win-x64/DatabaseManager.exe
          test -x artifacts/linux-x64/DatabaseManager
          test ! -d artifacts/win-x64/Profiles
          test ! -d artifacts/linux-x64/Profiles
          (cd artifacts/win-x64 && zip -qr ../DatabaseManager-v1.1.1-win-x64.zip .)
          tar -czf artifacts/DatabaseManager-v1.1.1-linux-x64.tar.gz -C artifacts/linux-x64 .
          unzip -tq artifacts/DatabaseManager-v1.1.1-win-x64.zip
          tar -tzf artifacts/DatabaseManager-v1.1.1-linux-x64.tar.gz > /dev/null
          (cd artifacts && sha256sum DatabaseManager-v1.1.1-* > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          - 修复 SQLite 文件连接表单与对象树拖拽、双击展开冲突。
          - 改进各数据库的填写提示、默认端口、参数校验和 SSL 设置。
          - Oracle/达梦自动读取登录用户 Schema；DuckDB 持久保存只读设置。
          - 主程序更名为 DatabaseManager.exe（Windows）和 DatabaseManager（Linux）。

          Windows x64 和 Linux x64 发布包均包含 .NET 10 运行时。
          NOTES
          gh release create v1.1.1 artifacts/DatabaseManager-v1.1.1-win-x64.zip artifacts/DatabaseManager-v1.1.1-linux-x64.tar.gz artifacts/SHA256SUMS.txt --verify-tag --title "DatabaseManager V1.1.1" --notes-file release-notes.md
